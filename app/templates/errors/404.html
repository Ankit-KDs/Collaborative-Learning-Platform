{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-5 border-0 shadow-sm">
                <div class="stat-icon stat-icon-blue mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-question-diamond"></i>
                </div>
                <h1 class="display-6 fw-bold mb-2">404 - Page Not Found</h1>
                <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
                <div>
                    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary rounded-pill px-4 fw-semibold">
                        Back to Safety
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
